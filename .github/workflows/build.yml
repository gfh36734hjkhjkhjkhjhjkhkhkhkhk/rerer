name: Build Prism

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ZAPRET_VERSION: "1.10.3"
  ZAPRET_ZIP_SHA256: "244314ae1c24538a0d751601da8e0c925c843371eec4456eb15f14c4fd6b7058"
  # winws.exe из официального zapret v72.9 (bol-van)
  WINWS_SHA256: "affb4f69d2ea302a7abccd5325d81826e140ddae014f1e070bc4a6c0dd555188"
  TG_PROXY_TAG: "v1.11.1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Скачать zapret от Flowseal и проверить хэши
        shell: pwsh
        run: |
          $v = $env:ZAPRET_VERSION
          Invoke-WebRequest "https://github.com/Flowseal/zapret-discord-youtube/releases/download/$v/zapret-discord-youtube-$v.zip" -OutFile z.zip
          $h = (Get-FileHash z.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:ZAPRET_ZIP_SHA256) { throw "Хэш архива zapret не совпал: $h" }
          Expand-Archive z.zip -DestinationPath z
          $src = Get-ChildItem z -Directory | Select-Object -First 1
          $w = (Get-FileHash "$($src.FullName)/bin/winws.exe" -Algorithm SHA256).Hash.ToLower()
          if ($w -ne $env:WINWS_SHA256) { throw "Хэш winws.exe не совпал: $w" }
          $dst = "src-tauri/resources/zapret"
          New-Item -ItemType Directory "$dst/strategies" -Force | Out-Null
          Copy-Item "$($src.FullName)/bin" "$dst/bin" -Recurse
          Copy-Item "$($src.FullName)/lists" "$dst/lists" -Recurse
          Copy-Item "$($src.FullName)/general*.bat" "$dst/strategies/"
          Copy-Item "$($src.FullName)/LICENSE.txt" "$dst/LICENSE.txt" -ErrorAction SilentlyContinue
          Set-Content "$dst/version.txt" "flowseal-$v" -NoNewline
          Get-ChildItem "$dst/strategies" | Measure-Object | ForEach-Object { "Стратегий: $($_.Count)" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать tg-ws-proxy из исходников Flowseal
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:TG_PROXY_TAG https://github.com/Flowseal/tg-ws-proxy tgsrc
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography h2 "httpx[http2]" certifi pillow
          Copy-Item scripts/tg_launcher.py tgsrc/prism_tg.py
          Push-Location tgsrc
          pyinstaller --onefile --name tg-ws-proxy --collect-submodules proxy --noconfirm prism_tg.py
          Pop-Location
          New-Item -ItemType Directory src-tauri/resources/tgproxy -Force | Out-Null
          Copy-Item tgsrc/dist/tg-ws-proxy.exe src-tauri/resources/tgproxy/
          Copy-Item tgsrc/LICENSE src-tauri/resources/tgproxy/LICENSE.txt
          ./src-tauri/resources/tgproxy/tg-ws-proxy.exe --help | Select-Object -First 3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Иконки
        shell: pwsh
        run: |
          python scripts/make_icon.py
          npx --yes @tauri-apps/cli@2 icon app-icon.png -o src-tauri/icons

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Собрать Prism
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build

      - name: Упаковать
        id: pack
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory dist -Force | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName "dist/Prism-$ver-setup.exe"
          New-Item -ItemType Directory portable/Prism -Force | Out-Null
          Copy-Item src-tauri/target/release/prism.exe portable/Prism/Prism.exe
          Copy-Item src-tauri/resources portable/Prism/resources -Recurse
          Compress-Archive portable/Prism "dist/Prism-$ver-portable.zip"
          Get-ChildItem dist | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Prism
          path: dist/*

      - name: Выложить релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pack.outputs.version }}
          name: Prism ${{ steps.pack.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body: |
            **Prism-${{ steps.pack.outputs.version }}-setup.exe** — установщик (рекомендуется).
            **Prism-${{ steps.pack.outputs.version }}-portable.zip** — без установки: распакуйте и запустите Prism.exe.

            Внутри: zapret-discord-youtube ${{ env.ZAPRET_VERSION }} от Flowseal (winws.exe из zapret v72.9, хэш проверен при сборке) и tg-ws-proxy ${{ env.TG_PROXY_TAG }}, собранный из исходников Flowseal.
            Файл собран автоматически GitHub Actions из кода этого репозитория. Хэши — в SHA256SUMS.txt.
